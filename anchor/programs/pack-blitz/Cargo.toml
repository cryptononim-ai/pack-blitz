[package]
name = "pack-blitz"
version = "0.1.0"
description = "Pack Blitz — VRF pack-opening game on MagicBlock Ephemeral Rollups (Solana Blitz v10)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pack_blitz"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
# SDK 0.16.2 — the exact version the upstream roll-dice-delegated example
# pins. 0.18 dropped `create_request_scoped_randomness_ix` (the call the
# proven program uses); its replacement
# `create_request_randomness_ix_const` produced a callback that starved
# on compute units (25 Nov 2026). Do NOT bump to 0.18/0.20 without
# re-verifying the VRF callback end-to-end on devnet.
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }
